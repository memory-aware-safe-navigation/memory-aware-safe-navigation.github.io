<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Figure 1 method overview placeholder">
  <rect width="960" height="420" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="36" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#1e293b">Fig. 1 — Method Overview (placeholder)</text>
  <!-- Environment -->
  <rect x="40" y="80" width="160" height="280" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="120" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#312e81">Environment</text>
  <text x="120" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4338ca">RGB Camera</text>
  <text x="120" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4338ca">LiDAR</text>
  <text x="120" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4338ca">IMU &amp; Encoder</text>
  <!-- Detection -->
  <rect x="240" y="80" width="180" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1e40af">Dynamic Obstacle</text>
  <text x="330" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1e40af">Detection</text>
  <text x="330" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">Human poses &amp; velocities</text>
  <!-- Localization -->
  <rect x="240" y="240" width="180" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="290" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#166534">Localization</text>
  <text x="330" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">Robot global state</text>
  <!-- Online learning -->
  <rect x="460" y="120" width="220" height="200" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="570" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#92400e">Online Environment</text>
  <text x="570" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#92400e">Learning</text>
  <text x="570" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">Occupancy map</text>
  <text x="570" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">Distance field f_dist</text>
  <text x="570" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">Static vs dynamic</text>
  <!-- Controller -->
  <rect x="720" y="140" width="200" height="160" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="820" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#9d174d">Stage-Adaptive</text>
  <text x="820" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#9d174d">MCBF-QP</text>
  <text x="820" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9d174d">Actions → Robot</text>
  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <line x1="200" y1="140" x2="240" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="300" x2="240" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="140" x2="460" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="300" x2="460" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="220" x2="720" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="400" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Replace with paper Fig. 1 when available</text>
</svg>
